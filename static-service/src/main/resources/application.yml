spring:
  application:
    name: static-service
    api-prefix: ''
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATABASE_URL:jdbc:postgresql://localhost:5432/static-data-service}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    show-sql: true
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    enabled: true
    default-schema: public
    url: ${SPRING_DATABASE_URL:jdbc:postgresql://localhost:5432/static-data-service}
    user: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    drop-first: false
  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/fortunatishomes}
  cache:
    type: redis
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
server:
  port: ${SPRING_APPLICATION_PORT:8181}

service:
  param:
    keycloak:
      base-url: ${KEYCLOAK_BASE_URI:http://localhost:8181}
      realm: ${KEYCLOAK_REALM_NAME:fortunatishomes}
      client-id: ${KEYCLOAK_CLIENT_ID:static-api}
      client-secret: ${KEYCLOAK_CLIENT_SECRET:**********}
      grant-type: client_credentials
    user-service:
      base-url: ${USER_SERVICE_URL:http://localhost:8183/api/v1}

springfox:
  documentation:
    type: swagger_2
    enabled: true  # Set false to disable
  swagger-ui:
    base-url: /swagger-ui/  # URL to access swagger UI

logging:
  level:
    root: INFO
springdoc:
  show-actuator: false
  enable-kotlin: false
  swagger-ui:
    doc-expansion: none
    tags-sorter: alpha
    filter: false # will be applied on large endpoints
    groups-order: asc
