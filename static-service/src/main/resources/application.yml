spring:
  application:
    name: static-data-service
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/static-data-service
    username: root
    password: root
    jpa:
      hibernate:
        ddl-auto: update
        show-sql: true
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    enabled: true
    default-schema: public
    url: jdbc:postgresql://localhost:5432/static-data-service
    user: root
    password: root
    drop-first: false
  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: http://localhost:8080/realms/fortunatishomes
server:
  port: 8181

springfox:
  documentation:
    type: swagger_2
    enabled: true  # Set false to disable
  swagger-ui:
    base-url: /swagger-ui/  # URL to access swagger UI


logging:
  level:
    root: INFO
springdoc:
  show-actuator: true
