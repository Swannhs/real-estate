version: "3"

services:
  mysql:
    container_name: mysql
    image: mysql:8.0.26
    environment:
      MYSQL_ROOT_USER: root
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventory-service
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./database/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    network_mode: "host"

  postgres:
    container_name: postgres
    image: postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      PGDATA: /data/postgres
    volumes:
      - ./data/postgres:/data/postgres
      - ./database/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    network_mode: "host"

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:22.0.5
    volumes:
      - ./keycloak/data:/opt/keycloak/data/import
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://localhost:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: localhost
    entrypoint: [ "/opt/keycloak/bin/kc.sh", "start-dev", "--import-realm" ]
    depends_on:
      - mysql
    network_mode: "host"

  static-service:
    container_name: static-service
    image: static-service
    build:
      context: static-service
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: 'docker'
    volumes:
      - ./static-service:/app
      - ~/.m2:/root/.m2
    depends_on:
      - postgres
      - keycloak
    restart: on-failure
    network_mode: "host"

  client-service:
    container_name: client-service
    build:
      context: ./client-service
      dockerfile: Dockerfile
    volumes:
      - ./client-service:/app
    depends_on:
      - keycloak
    network_mode: "host"

  admin-ui-service:
    container_name: admin-ui-service
    build:
      context: ./admin-ui-service
      dockerfile: Dockerfile
    volumes:
      - ./admin-ui-service:/app
    depends_on:
      - keycloak
    network_mode: "host"